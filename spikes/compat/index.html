<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>S-00 · Compatibility test</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0e13; --s1: #12161d; --t: #e8ecf1; --m: #9aa6b4; --a: #3ddcb0; --d: #ff6b6b; --w: #f5b544; }
      body { margin: 0; background: var(--bg); color: var(--t); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 860px; margin: 0 auto; padding: 16px; }
      fieldset { border: 1px solid #2e3845; border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
      label { display: grid; gap: 4px; color: var(--m); }
      input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #2e3845; background: var(--s1); color: var(--t); }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--a); color: #04130e; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; margin-top: 12px; }
      pre { background: var(--s1); padding: 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
      .ok { color: var(--a); } .fail { color: var(--d); } .warn { color: var(--w); }
      .note { color: var(--m); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>S-00 · Provider compatibility test</h1>
      <p class="note">
        The data is used only on this page, in memory. It is not stored or sent anywhere other than
        your IPTV server. The report masks the server and the credentials.
      </p>
      <form id="form">
        <fieldset>
          <label>Server <input name="server" required placeholder="http://example.com:8080" autocomplete="off" /></label>
          <label>Username <input name="username" required autocomplete="off" /></label>
          <label>Password <input name="password" required type="password" autocomplete="off" /></label>
          <label>Live channel ID (optional — defaults to the first in the list)
            <input name="streamId" inputmode="numeric" autocomplete="off" />
          </label>
          <div class="row">
            <button type="submit">1. Test API</button>
            <button type="button" id="play-hls" disabled>2a. Play HLS (hls.js)</button>
            <button type="button" id="play-native" disabled>2b. Native HLS</button>
            <button type="button" id="play-ts" disabled>2c. TS (mpegts.js)</button>
          </div>
        </fieldset>
      </form>
      <video id="video" controls playsinline muted></video>
      <h2>Report</h2>
      <p class="note">Copy this text to Claude. It contains neither credentials nor the full server address.</p>
      <pre id="report"></pre>
    </main>
    <script type="module" src="./spike.ts"></script>
  </body>
</html>
